<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}RoadPulse AI{% endblock %}</title><link rel="icon" type="image/png" href="{{ url_for('static', filename='roadpulse-logo.png') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='roadpulse-logo.png') }}"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='pages.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='vehicles.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='workflow-light.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='reports-live.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='risk.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='home-real.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}"></head>
<body><header><a class="brand roadpulse-brand" href="/"><img src="{{ url_for('static', filename='roadpulse-logo.png') }}" alt="RoadPulse AI logo"><span class="brand-name">RoadPulse <b>AI</b></span></a><nav><a class="{{ 'active' if active_page == 'home' }}" href="/">Home</a><a class="{{ 'active' if active_page == 'monitor' }}" href="/monitor">Monitor</a><a class="{{ 'active' if active_page == 'workflow' }}" href="/workflow">Workflow</a><a class="{{ 'active' if active_page == 'reports' }}" href="/reports">Reports</a></nav><div id="system-pill" class="pill idle"><i></i> Offline</div></header><main>{% block content %}{% endblock %}</main><footer><a class="brand roadpulse-brand" href="/"><img src="{{ url_for('static', filename='roadpulse-logo.png') }}" alt="RoadPulse AI logo"><span class="brand-name">RoadPulse <b>AI</b></span></a><p>Optimization of Traffic Flow Recognition System</p><span>Flask · OpenCV · YOLO · SQLite</span></footer>{% block scripts %}<script src="{{ url_for('static', filename='app.js') }}"></script>{% endblock %}</body></html>
